<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      @page {
        size: 60mm 40mm;
        margin: 0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 60mm;
        height: 40mm;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 8pt;
        color: #000;
        background: #fff;
        overflow: hidden;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .label {
        position: relative;
        width: 60mm;
        height: 40mm;
        padding: 2.5mm;
        display: flex;
        align-items: stretch;
        gap: 2.5mm;
        overflow: hidden;
      }

      /* Watermark status — diagonal, di belakang seluruh konten */
      .watermark {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(-18deg);
        z-index: 0;
        font-size: 22pt;
        font-weight: 900;
        letter-spacing: 2px;
        color: rgba(0, 0, 0, 0.12);
        white-space: nowrap;
        pointer-events: none;
      }

      /* ── Kiri: QR code ── */
      .label-qr {
        position: relative;
        z-index: 1;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .label-qr img {
        width: 25mm;
        height: 25mm;
        display: block;
      }

      /* ── Kanan: detail data ── */
      .label-info {
        position: relative;
        z-index: 1;
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      /* 1. Nomor label — referensi, kecil & normal */
      .no-label {
        flex: 0 0 auto;
        font-size: 6.5pt;
        font-weight: normal;
        line-height: 1.15;
        word-break: break-all;
      }

      /* 2. Nama jenis — mengisi sisa ruang, tampil penuh (auto-fit) */
      .jenis {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        margin-top: 1mm;
        padding: 1mm 0;
        border-top: 0.3mm solid #000;
        border-bottom: 0.3mm solid #000;
        display: flex;
        align-items: center;
        overflow: hidden;
      }

      .jenis-text {
        width: 100%;
        max-height: 100%;
        overflow: hidden;
        font-size: 10pt;
        font-weight: bold;
        line-height: 1.15;
        word-break: break-word;
        overflow-wrap: anywhere;
      }

      /* 3. Baris info — 2 kolom: kiri jumlah pcs, kanan pembuat. Keduanya rata kiri. */
      .by {
        flex: 0 0 auto;
        margin-top: 1mm;
        font-size: 6.5pt;
        font-weight: normal;
        line-height: 1.2;
        display: flex;
        gap: 2mm;
      }

      .by-pcs {
        flex: 0 0 auto;
        text-align: left;
        word-break: break-all;
      }

      .by-name {
        flex: 1 1 auto;
        min-width: 0;
        text-align: right;
        word-break: break-all;
      }

      /* 4. Kode batch — data terbesar & paling scannable */
      .batch {
        flex: 0 0 auto;
        margin-top: 1mm;
        font-size: 12pt;
        font-weight: bold;
        line-height: 1;
        letter-spacing: 0.3px;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="label">
      <span class="watermark">{{watermarkText}}</span>

      <!-- Kiri: QR code -->
      <div class="label-qr">
        <img src="{{qrBase64}}" alt="QR" />
      </div>

      <!-- Kanan: detail data -->
      <div class="label-info">
        <div class="no-label">{{noLabel}}</div>

        <div class="jenis">
          <span class="jenis-text" id="jenisText">{{namaProduk}}</span>
        </div>

        <div class="by">
          <span class="by-pcs">{{pcs}} pcs</span>
          <span class="by-name">By&nbsp;: {{createBy}}</span>
        </div>

        <div class="batch">{{tanggal}}</div>
      </div>
    </div>

    <script>
      // Auto-fit nama jenis: kecilkan font sampai muat penuh tanpa terpotong.
      (function () {
        var box = document.querySelector(".jenis");
        var txt = document.getElementById("jenisText");
        if (!box || !txt) return;

        var size = 10; // pt, ukuran awal
        var minSize = 5; // pt, batas terkecil biar tetap terbaca
        var step = 0.25;

        function overflowing() {
          return (
            txt.scrollHeight > txt.clientHeight + 0.5 ||
            txt.scrollWidth > txt.clientWidth + 0.5
          );
        }

        txt.style.fontSize = size + "pt";
        while (overflowing() && size > minSize) {
          size -= step;
          txt.style.fontSize = size + "pt";
        }
      })();
    </script>
  </body>
</html>
